name: Credit Ledger Module

on:
  pull_request:
    paths:
      - "lib/credit-ledger/**"
      - ".github/workflows/credit-ledger-module.yml"
  push:
    branches: [main]
    paths:
      - "lib/credit-ledger/**"
      - ".github/workflows/credit-ledger-module.yml"

permissions:
  contents: read

jobs:
  verify-and-package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm --filter @viba/credit-ledger typecheck
      - name: Build
        run: pnpm --filter @viba/credit-ledger build
      - name: Test compiled module
        run: pnpm --filter @viba/credit-ledger test
      - name: Package for Cloudflare R2
        run: |
          mkdir -p module-package/credit-ledger-1.0.0
          cp -R lib/credit-ledger/dist module-package/credit-ledger-1.0.0/
          cp -R lib/credit-ledger/migrations module-package/credit-ledger-1.0.0/
          cp lib/credit-ledger/README.md lib/credit-ledger/manifest.json module-package/credit-ledger-1.0.0/
          cd module-package
          zip -qr credit-ledger-1.0.0.zip credit-ledger-1.0.0
          sha256sum credit-ledger-1.0.0.zip > credit-ledger-1.0.0.zip.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: credit-ledger-r2-package
          path: |
            module-package/credit-ledger-1.0.0.zip
            module-package/credit-ledger-1.0.0.zip.sha256
          retention-days: 30
      - name: Upload verified package to Cloudflare R2
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          set -euo pipefail
          endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          prefix="s3://${R2_BUCKET_NAME}/viba-modules/credit-ledger/1.0.0"
          aws s3 cp module-package/credit-ledger-1.0.0.zip "${prefix}/credit-ledger-1.0.0.zip" --endpoint-url "$endpoint" --only-show-errors
          aws s3 cp module-package/credit-ledger-1.0.0.zip.sha256 "${prefix}/credit-ledger-1.0.0.zip.sha256" --endpoint-url "$endpoint" --only-show-errors
          aws s3api head-object --bucket "$R2_BUCKET_NAME" --key "viba-modules/credit-ledger/1.0.0/credit-ledger-1.0.0.zip" --endpoint-url "$endpoint" >/dev/null
          aws s3api head-object --bucket "$R2_BUCKET_NAME" --key "viba-modules/credit-ledger/1.0.0/credit-ledger-1.0.0.zip.sha256" --endpoint-url "$endpoint" >/dev/null
