name: Organise frontend assets

on:
  push:
    branches:
      - simplify/user-flows
    paths:
      - scripts/organize-assets.mjs
      - .github/workflows/organize-assets.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  organise-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: simplify/user-flows
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Organise root assets
        run: node scripts/organize-assets.mjs --apply

      - name: Validate migration output
        shell: bash
        run: |
          test -d artifacts/bridge-ai/public/assets/backgrounds
          test -d artifacts/bridge-ai/public/assets/brand
          test -d artifacts/bridge-ai/public/assets/icons
          test -d artifacts/bridge-ai/public/assets/illustrations
          test -d artifacts/bridge-ai/public/assets/source-boards
          test -d artifacts/bridge-ai/public/assets/miscellaneous
          test -f artifacts/bridge-ai/src/lib/assets.generated.ts
          test -f ASSET_ORGANISATION_REPORT.md

      - name: Commit organised assets
        shell: bash
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "No asset changes were required."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(assets): organise frontend asset library [skip ci]"
          git push origin HEAD:simplify/user-flows
