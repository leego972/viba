name: Full API Suite

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  full-api-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --reporter=silent

      - name: Build workspace type declarations
        run: pnpm run typecheck:libs

      - name: Run full API server test suite
        run: pnpm --filter @workspace/api-server run test
