name: Full API Suite

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  full-api-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: viba_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d viba_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/viba_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --reporter=silent

      - name: Build workspace type declarations
        run: pnpm run typecheck:libs

      - name: Apply test database schema
        run: pnpm --filter @workspace/db run push-force

      - name: Run full API server test suite
        run: pnpm --filter @workspace/api-server run test
