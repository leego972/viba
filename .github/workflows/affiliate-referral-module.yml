name: Affiliate Referral Module

on:
  pull_request:
    paths:
      - "lib/affiliate-referral/**"
      - ".github/workflows/affiliate-referral-module.yml"
  push:
    branches: [main]
    paths:
      - "lib/affiliate-referral/**"
      - ".github/workflows/affiliate-referral-module.yml"

permissions:
  contents: read
  statuses: write

jobs:
  verify-and-package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm --filter @viba/affiliate-referral typecheck
      - name: Build
        run: pnpm --filter @viba/affiliate-referral build
      - name: Test compiled module
        run: pnpm --filter @viba/affiliate-referral test
      - name: Package for Cloudflare R2
        run: |
          mkdir -p module-package/affiliate-referral-1.0.0
          cp -R lib/affiliate-referral/dist module-package/affiliate-referral-1.0.0/
          cp -R lib/affiliate-referral/migrations module-package/affiliate-referral-1.0.0/
          cp lib/affiliate-referral/README.md lib/affiliate-referral/manifest.json module-package/affiliate-referral-1.0.0/
          cd module-package
          zip -qr affiliate-referral-1.0.0.zip affiliate-referral-1.0.0
          sha256sum affiliate-referral-1.0.0.zip > affiliate-referral-1.0.0.zip.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: affiliate-referral-r2-package
          path: |
            module-package/affiliate-referral-1.0.0.zip
            module-package/affiliate-referral-1.0.0.zip.sha256
          retention-days: 30
      - name: Upload and verify package in Cloudflare R2
        id: r2_upload
        continue-on-error: true
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          set -euo pipefail
          endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          prefix="viba-modules/affiliate-referral/1.0.0"
          aws s3 cp module-package/affiliate-referral-1.0.0.zip "s3://${R2_BUCKET_NAME}/${prefix}/affiliate-referral-1.0.0.zip" --endpoint-url "$endpoint" --only-show-errors
          aws s3 cp module-package/affiliate-referral-1.0.0.zip.sha256 "s3://${R2_BUCKET_NAME}/${prefix}/affiliate-referral-1.0.0.zip.sha256" --endpoint-url "$endpoint" --only-show-errors
          aws s3api head-object --bucket "$R2_BUCKET_NAME" --key "${prefix}/affiliate-referral-1.0.0.zip" --endpoint-url "$endpoint" >/dev/null
          aws s3api head-object --bucket "$R2_BUCKET_NAME" --key "${prefix}/affiliate-referral-1.0.0.zip.sha256" --endpoint-url "$endpoint" >/dev/null
      - name: Publish machine-readable R2 verification status
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/github-script@v7
        env:
          R2_UPLOAD_OUTCOME: ${{ steps.r2_upload.outcome }}
        with:
          script: |
            const verified = process.env.R2_UPLOAD_OUTCOME === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: verified ? 'success' : 'failure',
              context: 'R2 Upload / affiliate-referral',
              description: verified
                ? 'R2 ZIP and checksum verified for affiliate-referral 1.0.0'
                : 'R2 upload or object verification failed for affiliate-referral',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
      - name: Fail when R2 publication is not verified
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.r2_upload.outcome != 'success'
        run: exit 1
